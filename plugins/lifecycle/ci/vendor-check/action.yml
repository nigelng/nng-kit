name: "nng-kit vendor check"
description: >-
  Verify .agents/skills/ matches the lifecycle tag stamped in
  .agents/skills/.nng-kit-version. Use as
  nigelng/nng-kit/plugins/lifecycle/ci/vendor-check@lifecycle-vX.Y.Z
inputs:
  path:
    description: "Repo root containing .agents/skills"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: bash "${{ github.action_path }}/../../scripts/vendor-skills.sh" --check "$INPUT_PATH"
